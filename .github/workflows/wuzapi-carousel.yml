name: WuzAPI carousel prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "operations/wuzapi-carousel/**"
      - ".github/workflows/wuzapi-carousel.yml"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the inspected upstream source and extension
        run: |
          python3 operations/wuzapi-carousel/prepare.py \
            --download \
            --archive "$RUNNER_TEMP/carousel-upstream.tar.gz" \
            --output "$RUNNER_TEMP/carousel-source"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.14"
          cache: false
      - name: Validate and build the provider without connecting sessions
        working-directory: ${{ runner.temp }}/carousel-source
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l carousel.go carousel_test.go)"
          go test -count=1 ./...
          go build -trimpath -o "$RUNNER_TEMP/wuzapi-carousel" .
