name: WuzAPI carousel prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "operations/wuzapi-carousel/**"
      - ".github/workflows/wuzapi-carousel.yml"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the inspected upstream source and extension
        run: |
          python3 operations/wuzapi-carousel/prepare.py \
            --download \
            --archive "$RUNNER_TEMP/carousel-upstream.tar.gz" \
            --output "$RUNNER_TEMP/carousel-source"
      - name: Install the checksum-pinned official Go toolchain
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            https://go.dev/dl/go1.25.14.linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/carousel-go.tar.gz"
          printf '%s  %s\n' \
            a21ae5633a269bcd7e90cf767e48225633795e99d831742cbf3397064fee7712 \
            "$RUNNER_TEMP/carousel-go.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/carousel-go"
          tar -xzf "$RUNNER_TEMP/carousel-go.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/carousel-go"
      - name: Validate and build the provider without connecting sessions
        working-directory: ${{ runner.temp }}/carousel-source
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
          GOROOT: ${{ runner.temp }}/carousel-go
        run: |
          test -z "$("$GOROOT/bin/gofmt" -l carousel.go carousel_test.go)"
          "$GOROOT/bin/go" test -count=1 ./...
          "$GOROOT/bin/go" build -trimpath -o "$RUNNER_TEMP/wuzapi-carousel" .
