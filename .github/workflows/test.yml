name: tests

on:
  workflow_dispatch:
    inputs:
      peer_ref:
        description:
          "Full Marketing Center commit SHA for coordinated release validation"
        required: false
        type: string
  pull_request:
    branches:
      - "16.0*"
  push:
    branches:
      - "16.0"
      - "16.0-ocabot-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    env:
      PEER_REF: ${{ inputs.peer_ref || '69e589a35c40247e03206856a5d869686c714a59' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-ocb16.0:latest
            name: test with OCB
            makepot: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate coordinated dependency revision
        shell: bash
        run: |
          if ! [[ "$PEER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "peer_ref must be a full 40-character commit SHA."
            exit 1
          fi
      - name: Checkout private Marketing Center dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: soloztech/marketing-center
          # PRs use the validated compatible baseline; a manual release run
          # selects the exact coordinated peer commit without rewriting the workflow.
          ref: ${{ env.PEER_REF }}
          path: .ci-private-dependency/marketing-center
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - name: Install private Marketing Center addon dependencies
        shell: bash
        run: |
          set -euo pipefail
          sibling_parent="$(mktemp -d "${RUNNER_TEMP}/contact-center-ci.XXXXXX")"
          sibling_root="${sibling_parent}/marketing-center"
          mv "${GITHUB_WORKSPACE}/.ci-private-dependency/marketing-center" "${sibling_root}"
          python -m pip install --editable "${sibling_root}/setup/meta_api_base"
          python -m pip install --editable "${sibling_root}/setup/meta_webhook_base"
      - name: Checkout installed Contact Center version for native upgrade rehearsal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 33e662b1d95ba34a879c5f652719911c8902969f
          path: .ci-old-contact-center
          persist-credentials: false
      - name: Isolate old addon source from candidate discovery
        shell: bash
        run: |
          set -euo pipefail
          old_parent="$(mktemp -d "${RUNNER_TEMP}/contact-center-upgrade-old.XXXXXX")"
          mv "${GITHUB_WORKSPACE}/.ci-old-contact-center" "${old_parent}/contact-center"
          printf 'CC_ACCESS_OLD_ROOT=%s\n' "${old_parent}/contact-center" >> "$GITHUB_ENV"
      - name: Checkout current production version for additive upgrade rehearsal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4b27b1dcfa48a6782185b8f37614e9f637253d88
          path: .ci-installed-contact-center
          persist-credentials: false
      - name: Isolate current production source from candidate discovery
        shell: bash
        run: |
          set -euo pipefail
          installed_parent="$(mktemp -d "${RUNNER_TEMP}/contact-center-upgrade-installed.XXXXXX")"
          mv "${GITHUB_WORKSPACE}/.ci-installed-contact-center" "${installed_parent}/contact-center"
          printf 'CC_INSTALLED_ROOT=%s\n' "${installed_parent}/contact-center" >> "$GITHUB_ENV"
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Test cumulative inbox access migration guards
        run:
          python -m unittest discover -s release_migrations/tests -p
          'test_account_access_many2many.py'
      - name: Rehearse native Contact Center access upgrade from installed version
        shell: bash
        timeout-minutes: 40
        run: |
          python release_migrations/native_access_upgrade_rehearsal.py \
            --old-root "$CC_ACCESS_OLD_ROOT" \
            --installed-root "$CC_INSTALLED_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/.ci-access-upgrade"
      - name: Upload native access upgrade evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Native access upgrade rehearsal - ${{ matrix.name }}
          path: |
            .ci-access-upgrade/*.json
            .ci-access-upgrade/*.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Test CRM without Kanban in a separate database
        env:
          INCLUDE: contact_center_crm
          PGDATABASE: contact_center_crm_independent
        run: |
          set -e
          oca_init_test_database
          oca_run_tests
          python - <<'PYTHON'
          import os
          import psycopg2
          with psycopg2.connect(dbname=os.environ["PGDATABASE"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT (SELECT count(*) FROM ir_module_module WHERE name = 'contact_center_crm' AND state = 'installed') = 1 AND NOT EXISTS (SELECT 1 FROM ir_module_module WHERE name = 'contact_center_kanban' AND state = 'installed') AND NOT EXISTS (SELECT 1 FROM ir_model WHERE model = 'contact.center.case')")
                  assert cursor.fetchone()[0], "CRM must install without Kanban or case models"
                  cursor.execute("SELECT NOT EXISTS (SELECT 1 FROM ir_module_module WHERE name IN ('sale', 'account') AND state = 'installed')")
                  assert cursor.fetchone()[0], "Customer panel must not install Sales or Accounting"
          PYTHON
      - name: Test customer panel with native Sales and Accounting
        shell: bash
        env:
          INCLUDE: contact_center_crm
          PGDATABASE: contact_center_customer_documents
        run: |
          set -euo pipefail
          oca_init_test_database
          odoo -d "$PGDATABASE" -i sale --stop-after-init --http-interface=127.0.0.1 | oca_checklog_odoo
          oca_run_tests
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - name: Update .pot files
        run:
          oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN
          }}@github.com/${{ github.repository }}
        if:
          ${{ matrix.makepot == 'true' && github.event_name == 'push' &&
          github.repository_owner == 'soloztech' }}
